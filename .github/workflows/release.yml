name: Public preview release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run Python tests
        run: python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Package public source
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: python -B scripts/build_source.py --version "$RELEASE_VERSION"
      - name: Publish preview download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" .release/*-source.zip --verify-tag --prerelease --title "Genea $RELEASE_VERSION" --notes-file PUBLICATION.md
